services:
  - type: web
    name: ufc-fight-predictor-api
    runtime: python
    plan: free
    rootDir: .
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FRONTEND_ORIGINS
        sync: false
      # "current" serves models/ufc_winner_model.joblib; "prefight" serves models/ufc_prefight_model.joblib
      # (and falls back to the current one if that file cannot be loaded). Change it in the dashboard to switch.
      - key: PREDICTION_MODEL
        value: current
