name: Update data

on:
  schedule:
    - cron: "0 7 * * *" # daily, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh ESPN data, UFC rankings, fighter photos and the static athlete pages
        id: refresh
        # One flaky source must not cost the whole day. update_all keeps going after a failing step, leaves that step's
        # files untouched, and puts back the files of a source that came out broken (scripts/quarantine.py), so whatever
        # did refresh is still validated and committed below. The run is still marked as failed at the end (last step) so
        # the problem is not hidden.
        continue-on-error: true
        # The picks saved for the track record must come from the model the site serves. Both serve the pre-fight model
        # unless the repository variable PREDICTION_MODEL and the same variable on the API host are set to "current".
        env:
          PREDICTION_MODEL: ${{ vars.PREDICTION_MODEL }}
        # Photos are small WebP files (about 10 KB each). Only new fighters and active ones still without a photo are
        # fetched, and validate_data fails the run if the manifest lists a photo that is not on disk.
        run: python -m scripts.update_all

      - name: Validate refreshed data
        run: python -m scripts.validate_data

      - name: Check that the API works with the refreshed data
        run: python -m scripts.smoke_api

      - name: Commit and push changes
        run: |
          git add data/raw frontend/public/fighter-photos frontend/public/og frontend/src/seo/athletes.json frontend/src/seo/athleteDetails.json frontend/src/seo/pages.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "fight-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(data): daily refresh $(date -u +%F)"
          # The refresh takes over half an hour: a push made meanwhile must not cost it.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

      - name: Run tests
        # After the commit: whether the code is right does not depend on today's data, and a test must not cost a day of it.
        # The model regression test (about two minutes) runs in CI on every push.
        id: tests
        continue-on-error: true
        run: pytest -q -m "not model_regression"

      - name: Report what failed
        if: steps.refresh.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          if [ "${{ steps.refresh.outcome }}" = "failure" ]; then
            echo "::error::A refresh step failed. See the run's summary. The sources that worked were validated and committed."
          fi
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "::error::The data was committed, but a test fails with it. See the Run tests step."
          fi
          exit 1
