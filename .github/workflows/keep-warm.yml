name: Keep API warm

# The API runs on a free host that goes to sleep after about 15 minutes without a request, and the first visitor after
# that waits many seconds for it to start (the "Iniciando servidor API" screen). A request every 10 minutes keeps it up.
#
# Hours: 08:00 to 02:00 in São Paulo (UTC-3), the hours the site is used. An always-on service uses about 744 of the
# 750 free instance hours a month, and those hours are shared by every free service in the same Render account (check
# render.com/pricing: this is how the free plan worked when this was written). Running 18 hours a day leaves room for
# other services. To keep it warm all day, change the hour field to "*".
on:
  schedule:
    - cron: "*/10 11-23,0-4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API through the site
        # Through the site, so the whole path is exercised (Vercel rewrite, then Render). A start from asleep takes
        # up to a minute or two, so each try waits long. A failure is a warning, not a failed run: this job is a
        # convenience, and a red run every ten minutes would bury the failures that matter.
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 100 "https://www.vektormma.com/api/health?keepwarm=1" || true)
            if [ "$code" = "200" ]; then
              echo "API is up (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt: status ${code:-none}."
            sleep 15
          done
          echo "::warning::The API did not answer /health after 3 tries."
